<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>421 Front Panel Emulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #panel-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            aspect-ratio: 1400 / 700;
        }
        #panel-svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        #help-tooltip {
            position: fixed;
            background: linear-gradient(135deg, #1e3a5f 0%, #0d1f33 100%);
            color: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 350px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 2px #4a90d9;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-family: Arial, sans-serif;
        }
        #help-tooltip.visible {
            opacity: 1;
        }
        #help-tooltip .tooltip-title {
            font-weight: bold;
            color: #4a90d9;
            font-size: 16px;
            margin-bottom: 8px;
            border-bottom: 1px solid #4a90d9;
            padding-bottom: 5px;
        }
        #help-tooltip .tooltip-desc {
            color: #e0e0e0;
        }
        .help-active {
            cursor: help !important;
        }
        .help-active #lcd-canvas {
            cursor: help !important;
        }
    </style>
</head>
<body>

<div id="panel-container">

function generateSVG() {
    const svg = document.getElementById('panel-svg');
    let s = `
        <defs>
            <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#2a4a70"/>
                <stop offset="50%" stop-color="${CONFIG.panelColor}"/>
                <stop offset="100%" stop-color="${CONFIG.panelDark}"/>
            </linearGradient>
            <linearGradient id="rackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#a8a8a8"/>
                <stop offset="15%" stop-color="#d0d0d0"/>
                <stop offset="50%" stop-color="#e8e8e8"/>
                <stop offset="85%" stop-color="#d0d0d0"/>
                <stop offset="100%" stop-color="#a0a0a0"/>
            </linearGradient>
            <linearGradient id="rackGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#a0a0a0"/>
                <stop offset="15%" stop-color="#d0d0d0"/>
                <stop offset="50%" stop-color="#e8e8e8"/>
                <stop offset="85%" stop-color="#d0d0d0"/>
                <stop offset="100%" stop-color="#a8a8a8"/>
            </linearGradient>
            <radialGradient id="screwHoleGrad" cx="40%" cy="40%">
                <stop offset="0%" stop-color="#1a1a1a"/>
                <stop offset="80%" stop-color="#333333"/>
                <stop offset="100%" stop-color="#505050"/>
            </radialGradient>
            <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#2a4a70"/>
                <stop offset="50%" stop-color="#1e3a5f"/>
                <stop offset="100%" stop-color="#152a48"/>
            </linearGradient>
            <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#a0a0a0"/>
                <stop offset="50%" stop-color="#c0c0c0"/>
                <stop offset="100%" stop-color="#909090"/>
            </linearGradient>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
            </filter>
        </defs>
    `;

    // Main panel background
    s += `<rect x="0" y="0" width="${CONFIG.panelWidth}" height="${CONFIG.panelHeight}" fill="url(#panelGrad)"/>`;

    // Rack mount ears (left and right) - polished silver with 2 holes each
    const earWidth = 45;

    // Left ear - polished silver
    s += `<rect x="0" y="0" width="${earWidth}" height="${CONFIG.panelHeight}" fill="url(#rackGrad)"/>`;
    s += `<line x1="0" y1="0" x2="0" y2="${CONFIG.panelHeight}" stroke="#f0f0f0" stroke-width="1"/>`; // Left edge highlight
    s += `<line x1="${earWidth}" y1="0" x2="${earWidth}" y2="${CONFIG.panelHeight}" stroke="#808080" stroke-width="1"/>`; // Right edge shadow

    // Right ear - polished silver
    s += `<rect x="${CONFIG.panelWidth - earWidth}" y="0" width="${earWidth}" height="${CONFIG.panelHeight}" fill="url(#rackGradRight)"/>`;
    s += `<line x1="${CONFIG.panelWidth - earWidth}" y1="0" x2="${CONFIG.panelWidth - earWidth}" y2="${CONFIG.panelHeight}" stroke="#808080" stroke-width="1"/>`; // Left edge shadow
    s += `<line x1="${CONFIG.panelWidth}" y1="0" x2="${CONFIG.panelWidth}" y2="${CONFIG.panelHeight}" stroke="#f0f0f0" stroke-width="1"/>`; // Right edge highlight

    // Mounting holes - 2 per side (top and bottom)
    const holeRadius = 8;
    const holePositions = [80, 420]; // Y positions - near top and bottom

    const rightHoleX = CONFIG.panelWidth - earWidth / 2;

    holePositions.forEach(y => {

        s += `<circle cx="${leftHoleX}" cy="${y}" r="${holeRadius}" fill="url(#screwHoleGrad)"/>`;

    // Right ear holes
    holePositions.forEach(y => {

        s += `<circle cx="${rightHoleX}" cy="${y}" r="${holeRadius + 2}" fill="#909090"/>`;
        // Hole

    // Logo box with 421 - aligned with LCD left edge
    s += `

    // Title line and text - line with 421 on it, subtitle right below, both right-aligned

    // LCD Display with frame

    // Navigation arrows (outlined style like reference - tighter cluster)
    const arrowSize = 14;
    const arrowSpread = 40; // Distance from center to arrow

    const navCenterX = NAV.centerX;
    const navCenterY = NAV.centerY;

    // UP arrow - white fill, blue outline, white outer outline
    const upX = navCenterX, upY = navCenterY - arrowSpread;

            <polygon points="${upX},${upY - arrowSize} ${upX - arrowSize},${upY + arrowSize * 0.5} ${upX + arrowSize},${upY + arrowSize * 0.5}"

            <polygon points="${upX},${upY - arrowSize} ${upX - arrowSize},${upY + arrowSize * 0.5} ${upX + arrowSize},${upY + arrowSize * 0.5}"

    // LEFT arrow
    const leftX = navCenterX - arrowSpread, leftY = navCenterY;
    s += `<g id="btn_left" cursor="pointer">
            <polygon points="${leftX - arrowSize},${leftY} ${leftX + arrowSize * 0.5},${leftY - arrowSize} ${leftX + arrowSize * 0.5},${leftY + arrowSize}"

            <polygon points="${leftX - arrowSize},${leftY} ${leftX + arrowSize * 0.5},${leftY - arrowSize} ${leftX + arrowSize * 0.5},${leftY + arrowSize}"
                     fill="${CONFIG.white}" stroke="${CONFIG.panelColor}" stroke-width="3"/>
          </g>`;

    // RIGHT arrow
    const rightX = navCenterX + arrowSpread, rightY = navCenterY;
    s += `<g id="btn_right" cursor="pointer">
            <polygon points="${rightX + arrowSize},${rightY} ${rightX - arrowSize * 0.5},${rightY - arrowSize} ${rightX - arrowSize * 0.5},${rightY + arrowSize}"

            <polygon points="${rightX + arrowSize},${rightY} ${rightX - arrowSize * 0.5},${rightY - arrowSize} ${rightX - arrowSize * 0.5},${rightY + arrowSize}"

    // ESC button - rounded square like reference
    const escSize = 38;
    s += `<g id="btn_esc" cursor="pointer">
            <rect x="${NAV.esc.x - escSize/2}" y="${NAV.esc.y - escSize/2}" width="${escSize}" height="${escSize}"

            <text x="${NAV.esc.x}" y="${NAV.esc.y + 5}" fill="${CONFIG.white}" font-size="13" font-weight="bold" text-anchor="middle">ESC</text>
          </g>`;

    // ENT button - rounded square with enter arrow symbol like reference
    const ex = NAV.ent.x, ey = NAV.ent.y;
    const entSize = 38;
    s += `<g id="btn_ent" cursor="pointer">
            <rect x="${ex - entSize/2}" y="${ey - entSize/2}" width="${entSize}" height="${entSize}"
                  fill="${CONFIG.panelColor}" stroke="${CONFIG.white}" stroke-width="2" rx="10"/>
            <polyline points="${ex+5},${ey-12} ${ex+5},${ey-6} ${ex-5},${ey-6}"
                  fill="none" stroke="${CONFIG.white}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polygon points="${ex-7},${ey-6} ${ex-2},${ey-9} ${ex-2},${ey-3}" fill="${CONFIG.white}"/>
            <text x="${ex}" y="${ey + 10}" fill="${CONFIG.white}" font-size="13" font-weight="bold" text-anchor="middle">ENT</text>

    // ========== STATUS SECTION ==========
    // ENABLED LED and label
    s += `<circle id="led_enabled" cx="${STATUS.enabled.x}" cy="${STATUS.enabled.y}" r="5" fill="${CONFIG.ledOff}"/>`;
    s += `<text x="${STATUS.enabled.x + 12}" y="${STATUS.enabled.y + 4}" fill="${CONFIG.white}" font-size="12" font-weight="bold">ENABLED</text>`;

    // TRIP LED and label
    s += `<circle id="led_trip" cx="${STATUS.trip.x}" cy="${STATUS.trip.y}" r="5" fill="${CONFIG.ledOff}"/>`;
    s += `<text x="${STATUS.trip.x + 12}" y="${STATUS.trip.y + 4}" fill="${CONFIG.white}" font-size="12" font-weight="bold">TRIP</text>`;

    // TARGET RESET button - circle with blue fill, white outline, white text
    const trRadius = 28;
    s += `<g id="btn_target_reset" cursor="pointer">
            <circle cx="${STATUS.targetReset.x}" cy="${STATUS.targetReset.y}" r="${trRadius}"
                  fill="${CONFIG.panelColor}" stroke="${CONFIG.white}" stroke-width="2"/>

          </g>`;

    // ========== TARGET LED SECTION ==========
    // Border around target LEDs area
    s += `<rect x="685" y="135" width="210" height="310" fill="none" stroke="#3a5a80" stroke-width="1" rx="3"/>`;

    // Horizontal separator lines between LED groups (column-specific)
    // Between SOTF and ZONE 1 (left column only)
    s += `<line x1="690" y1="237" x2="780" y2="237" stroke="${CONFIG.white}" stroke-width="1" opacity="0.5"/>`;
    // Between ZONE 4 and PHASE A (left column only)
    s += `<line x1="690" y1="337" x2="780" y2="337" stroke="${CONFIG.white}" stroke-width="1" opacity="0.5"/>`;
    // Between 51 and 79 RESET (right column only)
    s += `<line x1="800" y1="187" x2="890" y2="187" stroke="${CONFIG.white}" stroke-width="1" opacity="0.5"/>`;
    // Between BKR CLOSE and BKR FAIL (right column only)
    s += `<line x1="800" y1="312" x2="890" y2="312" stroke="${CONFIG.white}" stroke-width="1" opacity="0.5"/>`;

    targetLEDs.forEach(led => {
        s += `<circle id="${led.id}" cx="${led.x}" cy="${led.y}" r="4" fill="${CONFIG.ledOff}" stroke="#1a2a3a" stroke-width="0.5"/>`;

    });

    // ========== PUSHBUTTON SECTION ==========
    // White background with rounded corners
    s += `<rect x="${BUTTON_BOX.x}" y="${BUTTON_BOX.y}" width="${BUTTON_BOX.width}" height="${BUTTON_BOX.height}"
               fill="${CONFIG.lightGrey}" stroke="#a0a0a0" stroke-width="1" rx="6"/>`;

    const rowHeight = BUTTON_BOX.height / 6;
    const colWidth = BUTTON_BOX.width / 2;

    // Draw horizontal separator lines
    for (let i = 1; i < 6; i++) {
        const y = BUTTON_BOX.y + i * rowHeight;
        s += `<line x1="${BUTTON_BOX.x + 5}" y1="${y}" x2="${BUTTON_BOX.x + BUTTON_BOX.width - 5}" y2="${y}" stroke="#b0b0b0" stroke-width="1"/>`;
    }

    // Draw vertical separator line
    s += `<line x1="${BUTTON_BOX.x + colWidth}" y1="${BUTTON_BOX.y + 5}" x2="${BUTTON_BOX.x + colWidth}" y2="${BUTTON_BOX.y + BUTTON_BOX.height - 5}" stroke="#b0b0b0" stroke-width="1"/>`;

    // Draw buttons with labels (matching reference layout)
    // Reference: Left column has button on LEFT, label on RIGHT
    //            Right column has label on LEFT, button on RIGHT
    const buttonIds = [
        ['btn_reclose_off', 'btn_reclose_on'],
        ['btn_comm_off', 'btn_comm_on'],
        ['btn_2_0', 'btn_2_1'],
        ['btn_3_0', 'btn_3_1'],
        ['btn_4_0', 'btn_4_1'],
        ['btn_5_0', 'btn_5_1']
    ];

    for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 2; col++) {
            const cellX = BUTTON_BOX.x + col * colWidth;
            const cellY = BUTTON_BOX.y + row * rowHeight;
            const cellCenterY = cellY + rowHeight / 2;

            // Button position - on OUTSIDE edge of each column
            const btnX = col === 0 ? cellX + 38 : cellX + colWidth - 38;

            // LED position - small indicator near button
            const ledX = col === 0 ? cellX + 70 : cellX + colWidth - 70;
            const ledY = cellY + 12;

            // Draw button circle (dark blue like reference) with ID for click handling
            const btnId = buttonIds[row][col];
            s += `<g id="${btnId}" cursor="pointer">
                    <ellipse cx="${btnX}" cy="${cellCenterY}" rx="26" ry="20" fill="url(#btnGrad)" stroke="#0a1525" stroke-width="1.5"/>
                  </g>`;

            // Draw LED indicator (small rectangle)
            const ledId = `btn_${row}_${col}_led`;
            s += `<rect id="${ledId}" x="${ledX - 4}" y="${ledY - 2}" width="8" height="5" rx="1" fill="${CONFIG.ledOff}" stroke="#808080" stroke-width="0.5"/>`;

            // Draw label for first 2 rows only - centered text
            const label = buttonLabels[row][col];
            if (label) {
                const lines = label.split('\n');
                // Center text in the label area (between button and cell edge)
                // Left column: center between button (x+64) and cell right edge
                // Right column: center between cell left edge and button (x+colWidth-64)
                const labelXPos = col === 0 ? cellX + 105 : cellX + 40;

                const totalHeight = lines.length * 12;
                const startY = cellCenterY - totalHeight / 2 + 10;

                lines.forEach((line, i) => {
                    s += `<text x="${labelXPos}" y="${startY + i * 12}" fill="${CONFIG.panelColor}" font-size="10" font-weight="bold" text-anchor="middle">${line}</text>`;
                });
            }
        }
    }

    svg.innerHTML = s;
    attachEventListeners();
}

// ============================================================
// EVENT HANDLING
// ============================================================
function attachEventListeners() {
    ['up', 'down', 'left', 'right'].forEach(dir => {
        document.getElementById('btn_' + dir)?.addEventListener('click', () => handleNav(dir));
    });
    document.getElementById('btn_esc')?.addEventListener('click', () => handleNav('esc'));
    document.getElementById('btn_ent')?.addEventListener('click', () => handleNav('ent'));
    document.getElementById('btn_target_reset')?.addEventListener('click', resetTargets);

    // Reclose and Comm Scheme buttons
    document.getElementById('btn_reclose_off')?.addEventListener('click', () => setReclose(false));
    document.getElementById('btn_reclose_on')?.addEventListener('click', () => setReclose(true));
    document.getElementById('btn_comm_off')?.addEventListener('click', () => setCommScheme(false));
    document.getElementById('btn_comm_on')?.addEventListener('click', () => setCommScheme(true));

    // Bottom left button triggers fault simulation
    document.getElementById('btn_5_0')?.addEventListener('click', simulateFault);

    // Bottom right button is HELP
    document.getElementById('btn_5_1')?.addEventListener('click', toggleHelpMode);

    // Add tooltip listeners for all LEDs when help mode is active
    setupHelpTooltips();
}

function toggleHelpMode() {
    state.helpMode = !state.helpMode;
    updateHelpButtonLED();

    const svg = document.getElementById('panel-svg');
    if (state.helpMode) {
        svg.classList.add('help-active');
    } else {
        svg.classList.remove('help-active');
        hideTooltip();
    }
}

function updateHelpButtonLED() {
    const led = document.getElementById('btn_5_1_led');
    if (led) {
        led.setAttribute('fill', state.helpMode ? CONFIG.ledGreen : CONFIG.ledOff);
    }
}

function setupLCDTooltips(tooltip, titleEl, descEl) {
    const lcdCanvas = document.getElementById('lcd-canvas');
    if (!lcdCanvas) return;

    // Calculate line positions on the LCD
    // Header is 22px, starts at y=0
    // Content starts at y=28, each line is 24px tall
    const headerHeight = 22;
    const contentStart = 28;
    const lineHeight = 24;

    // Helper to show a tooltip
    const showTooltip = (desc, e) => {
        if (!desc) return;

        const colonIndex = desc.indexOf(':');
        const title = desc.substring(0, colonIndex);
        const description = desc.substring(colonIndex + 1).trim();

        titleEl.textContent = title;
        descEl.textContent = description;

        positionTooltip(e);
        tooltip.classList.add('visible');
    };

    // Get visible menu items based on current scroll position
    const getVisibleMenuItems = () => {
        if (!state.currentMenu) return [];
        const items = state.currentMenu.items;
        const maxVisible = 8;
        const start = Math.max(0, state.selectedIndex - 5);
        const end = Math.min(items.length, start + maxVisible);
        return items.slice(start, end);
    };

    // Get menu item at a specific content line index
    const getMenuItemAtLine = (contentLineIndex) => {
        const visibleItems = getVisibleMenuItems();
        if (contentLineIndex >= 0 && contentLineIndex < visibleItems.length) {
            return visibleItems[contentLineIndex];
        }
        return null;
    };

    lcdCanvas.addEventListener('mousemove', (e) => {
        // Only show tooltips when help mode is active
        if (!state.helpMode) {
            tooltip.classList.remove('visible');
            return;
        }

        // Get canvas bounding rect to calculate relative position
        const rect = lcdCanvas.getBoundingClientRect();
        const scaleY = lcdCanvas.height / rect.height;
        const relativeY = (e.clientY - rect.top) * scaleY;

        // Handle EVENT display mode
        if (state.displayMode === 'event' && state.faultActive && state.eventIndex === 0) {
            let lineIndex = -1;

            if (relativeY >= 0 && relativeY < headerHeight) {
                lineIndex = 0;
            } else if (relativeY >= contentStart) {
                const contentY = relativeY - contentStart;
                const contentLineIndex = Math.floor(contentY / lineHeight);
                if (contentLineIndex >= 0 && contentLineIndex < 6) {
                    lineIndex = contentLineIndex + 1;
                }
            }

            if (lineIndex >= 0 && lineIndex <= 6) {
                showTooltip(eventHelpDescriptions[lineIndex], e);
            } else {
                tooltip.classList.remove('visible');
            }
            return;
        }

        // Handle MENU display mode
        if (state.displayMode === 'menu' && state.currentMenu) {
            // Check if hovering over header (menu title)
            if (relativeY >= 0 && relativeY < headerHeight) {
                const menuTitle = state.currentMenu.title;
                const desc = menuHelpDescriptions[menuTitle] || menuHelpDescriptions[menuTitle.replace(' MENU', '')];
                if (desc) {
                    showTooltip(desc, e);
                } else {
                    tooltip.classList.remove('visible');
                }
                return;
            }

            // Check if hovering over a menu item
            if (relativeY >= contentStart) {
                const contentY = relativeY - contentStart;
                const contentLineIndex = Math.floor(contentY / lineHeight);
                const menuItem = getMenuItemAtLine(contentLineIndex);

                if (menuItem) {
                    const desc = menuHelpDescriptions[menuItem];
                    if (desc) {
                        showTooltip(desc, e);
                    } else {
                        tooltip.classList.remove('visible');
                    }
                } else {
                    tooltip.classList.remove('visible');
                }
            } else {
                tooltip.classList.remove('visible');
            }
            return;
        }

        // No tooltip for other display modes
        tooltip.classList.remove('visible');
    });

    lcdCanvas.addEventListener('mouseleave', () => {
        tooltip.classList.remove('visible');
    });

    // Touch support for LCD tooltips
    lcdCanvas.addEventListener('touchstart', (e) => {
        if (!state.helpMode) return;

        const touch = e.touches[0];
        const rect = lcdCanvas.getBoundingClientRect();
        const scaleY = lcdCanvas.height / rect.height;
        const relativeY = (touch.clientY - rect.top) * scaleY;

        let desc = null;

        // Handle EVENT display mode
        if (state.displayMode === 'event' && state.faultActive && state.eventIndex === 0) {
            let lineIndex = -1;

            if (relativeY >= 0 && relativeY < headerHeight) {
                lineIndex = 0;
            } else if (relativeY >= contentStart) {
                const contentY = relativeY - contentStart;
                const contentLineIndex = Math.floor(contentY / lineHeight);
                if (contentLineIndex >= 0 && contentLineIndex < 6) {
                    lineIndex = contentLineIndex + 1;
                }
            }

            if (lineIndex >= 0 && lineIndex <= 6) {
                desc = eventHelpDescriptions[lineIndex];
            }
        }

        // Handle MENU display mode
        if (state.displayMode === 'menu' && state.currentMenu) {
            if (relativeY >= 0 && relativeY < headerHeight) {
                const menuTitle = state.currentMenu.title;
                desc = menuHelpDescriptions[menuTitle] || menuHelpDescriptions[menuTitle.replace(' MENU', '')];
            } else if (relativeY >= contentStart) {
                const contentY = relativeY - contentStart;
                const contentLineIndex = Math.floor(contentY / lineHeight);
                const menuItem = getMenuItemAtLine(contentLineIndex);
                if (menuItem) {
                    desc = menuHelpDescriptions[menuItem];
                }
            }
        }

        if (desc) {
            const colonIndex = desc.indexOf(':');
            const title = desc.substring(0, colonIndex);
            const description = desc.substring(colonIndex + 1).trim();

            titleEl.textContent = title;
            descEl.textContent = description;

            positionTooltip({ clientX: touch.clientX, clientY: touch.clientY });
            tooltip.classList.add('visible');

            setTimeout(() => tooltip.classList.remove('visible'), 4000);
        }
    }, { passive: true });
}

function setupHelpTooltips() {
    const tooltip = document.getElementById('help-tooltip');
    const titleEl = tooltip.querySelector('.tooltip-title');
    const descEl = tooltip.querySelector('.tooltip-desc');

    // Setup LCD canvas tooltips for event summary
    setupLCDTooltips(tooltip, titleEl, descEl);

    // Get all LED elements and their labels
    const allLedIds = [
        'led_enabled', 'led_trip',
        ...targetLEDs.map(led => led.id)
    ];

    allLedIds.forEach(ledId => {
        const ledEl = document.getElementById(ledId);
        if (!ledEl) return;

        const handleMouseEnter = (e) => {
            if (!state.helpMode) return;

            const desc = helpDescriptions[ledId];
            if (!desc) return;

            // Parse title and description
            const colonIndex = desc.indexOf(':');
            const title = desc.substring(0, colonIndex);
            const description = desc.substring(colonIndex + 1).trim();

            titleEl.textContent = title;
            descEl.textContent = description;

            positionTooltip(e);
            tooltip.classList.add('visible');
        };

        const handleMouseMove = (e) => {
            if (!state.helpMode || !tooltip.classList.contains('visible')) return;
            positionTooltip(e);
        };

        const handleMouseLeave = () => {
            tooltip.classList.remove('visible');
        };

        // For touch devices
        const handleTouchStart = (e) => {
            if (!state.helpMode) return;
            e.preventDefault();

            const desc = helpDescriptions[ledId];
            if (!desc) return;

            const colonIndex = desc.indexOf(':');
            const title = desc.substring(0, colonIndex);
            const description = desc.substring(colonIndex + 1).trim();

            titleEl.textContent = title;
            descEl.textContent = description;

            // Position near touch point
            const touch = e.touches[0];
            positionTooltip({ clientX: touch.clientX, clientY: touch.clientY });
            tooltip.classList.add('visible');

            // Hide after delay
            setTimeout(() => tooltip.classList.remove('visible'), 4000);
        };

        ledEl.addEventListener('mouseenter', handleMouseEnter);
        ledEl.addEventListener('mousemove', handleMouseMove);
        ledEl.addEventListener('mouseleave', handleMouseLeave);
        ledEl.addEventListener('touchstart', handleTouchStart, { passive: false });
    });

    // Also add listeners to text labels
    document.querySelectorAll('#panel-svg text').forEach(textEl => {
        const text = textEl.textContent;
        // Find matching LED by label
        const matchingLed = targetLEDs.find(led => led.label === text);
        if (!matchingLed && text !== 'ENABLED' && text !== 'TRIP') return;

        const ledId = matchingLed ? matchingLed.id : (text === 'ENABLED' ? 'led_enabled' : 'led_trip');

        textEl.style.cursor = 'inherit';

        textEl.addEventListener('mouseenter', (e) => {
            if (!state.helpMode) return;

            const desc = helpDescriptions[ledId];
            if (!desc) return;

            const colonIndex = desc.indexOf(':');
            const title = desc.substring(0, colonIndex);
            const description = desc.substring(colonIndex + 1).trim();

            titleEl.textContent = title;
            descEl.textContent = description;

            positionTooltip(e);
            tooltip.classList.add('visible');
        });

        textEl.addEventListener('mousemove', (e) => {
            if (!state.helpMode || !tooltip.classList.contains('visible')) return;
            positionTooltip(e);
        });

        textEl.addEventListener('mouseleave', () => {
            tooltip.classList.remove('visible');
        });

        textEl.addEventListener('touchstart', (e) => {
            if (!state.helpMode) return;
            e.preventDefault();

            const desc = helpDescriptions[ledId];
            if (!desc) return;

            const colonIndex = desc.indexOf(':');
            const title = desc.substring(0, colonIndex);
            const description = desc.substring(colonIndex + 1).trim();

            titleEl.textContent = title;
            descEl.textContent = description;

            const touch = e.touches[0];
            positionTooltip({ clientX: touch.clientX, clientY: touch.clientY });
            tooltip.classList.add('visible');

            setTimeout(() => tooltip.classList.remove('visible'), 4000);
        }, { passive: false });
    });

    // Add tooltip listeners for control buttons
    const buttonIds = ['btn_target_reset', 'btn_reclose_off', 'btn_reclose_on', 'btn_comm_off', 'btn_comm_on', 'btn_5_0'];
    const buttonHelpKeyMap = {
        'btn_5_0': 'btn_fault' // Map FAULT button to its help description
    };
    buttonIds.forEach(btnId => {
        const btnEl = document.getElementById(btnId);
        if (!btnEl) return;

        const helpKey = buttonHelpKeyMap[btnId] || btnId;

        const addTooltipEvents = (el) => {
            el.addEventListener('mouseenter', (e) => {
                if (!state.helpMode) return;
                const desc = helpDescriptions[helpKey];
                if (!desc) return;

                const colonIndex = desc.indexOf(':');
                const title = desc.substring(0, colonIndex);
                const description = desc.substring(colonIndex + 1).trim();

                titleEl.textContent = title;
                descEl.textContent = description;
                positionTooltip(e);
                tooltip.classList.add('visible');
            });

            el.addEventListener('mousemove', (e) => {
                if (!state.helpMode || !tooltip.classList.contains('visible')) return;
                positionTooltip(e);
            });

            el.addEventListener('mouseleave', () => {
                tooltip.classList.remove('visible');
            });

            el.addEventListener('touchstart', (e) => {
                if (!state.helpMode) return;
                // Don't prevent default - allow the button click to work
                const desc = helpDescriptions[helpKey];
                if (!desc) return;

                const colonIndex = desc.indexOf(':');
                const title = desc.substring(0, colonIndex);
                const description = desc.substring(colonIndex + 1).trim();

                titleEl.textContent = title;
                descEl.textContent = description;

                const touch = e.touches[0];
                positionTooltip({ clientX: touch.clientX, clientY: touch.clientY });
                tooltip.classList.add('visible');

                setTimeout(() => tooltip.classList.remove('visible'), 4000);
            }, { passive: true });
        };

        // Add events to the button group and its children
        addTooltipEvents(btnEl);
    });
}

function positionTooltip(e) {
    const tooltip = document.getElementById('help-tooltip');
    const padding = 15;

    let x = e.clientX + padding;
    let y = e.clientY + padding;

    // Keep tooltip on screen
    const rect = tooltip.getBoundingClientRect();
    const tooltipWidth = 350;
    const tooltipHeight = rect.height || 150;

    if (x + tooltipWidth > window.innerWidth) {
        x = e.clientX - tooltipWidth - padding;
    }
    if (y + tooltipHeight > window.innerHeight) {
        y = e.clientY - tooltipHeight - padding;
    }
    if (x < 0) x = padding;
    if (y < 0) y = padding;

    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
}

function hideTooltip() {
    document.getElementById('help-tooltip').classList.remove('visible');
}

function setReclose(on) {
    state.recloseOn = on;
    updatePushbuttonLEDs();

    // Update 79 target LEDs based on reclose state
    // When RECLOSE ON: 79 RESET lit, 79 LOCKOUT off
    // When RECLOSE OFF: 79 RESET off, 79 LOCKOUT lit
    state.leds['led_79_reset'] = on;
    state.leds['led_79_lockout'] = !on;
    render();
}

function setCommScheme(on) {
    state.commSchemeOn = on;
    updatePushbuttonLEDs();
}

function updatePushbuttonLEDs() {
    // Row 0: Reclose - left LED off when reclose off, right LED on when reclose on
    const recloseLedLeft = document.getElementById('btn_0_0_led');
    const recloseLedRight = document.getElementById('btn_0_1_led');
    if (recloseLedLeft) recloseLedLeft.setAttribute('fill', state.recloseOn ? CONFIG.ledOff : CONFIG.ledGreen);
    if (recloseLedRight) recloseLedRight.setAttribute('fill', state.recloseOn ? CONFIG.ledGreen : CONFIG.ledOff);

    // Row 1: Comm Scheme - left LED off when comm off, right LED on when comm on
    const commLedLeft = document.getElementById('btn_1_0_led');
    const commLedRight = document.getElementById('btn_1_1_led');
    if (commLedLeft) commLedLeft.setAttribute('fill', state.commSchemeOn ? CONFIG.ledOff : CONFIG.ledGreen);
    if (commLedRight) commLedRight.setAttribute('fill', state.commSchemeOn ? CONFIG.ledGreen : CONFIG.ledOff);
}

function handleNav(dir) {
    if (state.displayMode === 'rotating') {
        if (dir === 'down' || dir === 'right') {
            enterMenu(mainMenu);
        } else if (dir === 'up') {
            state.rotatingIndex = (state.rotatingIndex - 1 + rotatingScreens.length) % rotatingScreens.length;
            renderRotating();
        }
    } else if (state.displayMode === 'menu') {
        if (dir === 'up') {
            state.selectedIndex = Math.max(0, state.selectedIndex - 1);
            renderMenu();
        } else if (dir === 'down') {
            state.selectedIndex = Math.min(state.currentMenu.items.length - 1, state.selectedIndex + 1);
            renderMenu();
        } else if (dir === 'esc' || dir === 'left') {
            if (state.menuStack.length > 0) {
                const prev = state.menuStack.pop();
                state.currentMenu = prev.menu;
                state.selectedIndex = prev.index;
                renderMenu();
            } else {
                exitToRotating();
            }
        } else if (dir === 'ent' || dir === 'right') {
            const item = state.currentMenu.items[state.selectedIndex];
            // Handle submenus
            const submenus = {
                'METER': meterMenu,
                'EVENTS': eventsMenu,
                'BREAKER MONITOR': breakerMonitorMenu,
                'RELAY ELEMENTS': relayElementsMenu,
                'LOCAL CONTROL': localControlMenu,
                'SET/SHOW': setShowMenu,
                'RELAY STATUS': relayStatusMenu
            };
            if (submenus[item]) {
                state.menuStack.push({ menu: state.currentMenu, index: state.selectedIndex });
                state.currentMenu = submenus[item];
                state.selectedIndex = 0;
                renderMenu();
            } else if (item === 'EVENT SUMMARY') {
                // Show event summary (works even without fault, shows last event or no events)
                state.displayMode = 'event';
                state.eventIndex = 0;
                renderEvent();
            } else if (staticScreens[item]) {
                // Show static screen for this item
                state.displayMode = 'static';
                state.currentStaticScreen = item;
                renderStaticScreen(item);
            }
        }
    } else if (state.displayMode === 'static') {
        if (dir === 'esc' || dir === 'left') {
            state.displayMode = 'menu';
            renderMenu();
        }
    } else if (state.displayMode === 'event') {
        if (dir === 'down' || dir === 'right') {
            state.eventIndex = Math.min(eventScreens.length - 1, state.eventIndex + 1);
            renderEvent();
        } else if (dir === 'up' || dir === 'left') {
            state.eventIndex = Math.max(0, state.eventIndex - 1);
            renderEvent();
        } else if (dir === 'esc') {
            state.displayMode = 'menu';
            renderMenu();
        }
    }
}

function enterMenu(menu) {
    stopRotating();
    state.displayMode = 'menu';
    state.currentMenu = menu;
    state.selectedIndex = 0;
    state.menuStack = [];
    renderMenu();
}

function exitToRotating() {
    state.displayMode = 'rotating';
    state.menuStack = [];
    startRotating();
}

// ============================================================
// FAULT SIMULATION
// ============================================================
function simulateFault() {
    state.faultActive = true;

    state.leds['led_trip'] = true;
    state.leds['led_time'] = true;
    state.leds['led_zone2'] = true;
    state.leds['led_phase_b'] = true;
    state.leds['led_phase_c'] = true;
    state.leds['led_ground'] = true;
    state.leds['led_50'] = true;
    state.leds['led_79_reset'] = false;
    state.leds['led_79_lockout'] = true;

    render();

    // Flash the FAULT button LED red twice then turn off
    const faultLed = document.getElementById('btn_5_0_led');
    if (faultLed) {
        faultLed.setAttribute('fill', CONFIG.ledRed);
        setTimeout(() => {
            faultLed.setAttribute('fill', CONFIG.ledOff);
            setTimeout(() => {
                faultLed.setAttribute('fill', CONFIG.ledRed);
                setTimeout(() => {
                    faultLed.setAttribute('fill', CONFIG.ledOff);
                }, 150);
            }, 150);
        }, 150);
    }

    stopRotating();
    state.displayMode = 'event';
    state.eventIndex = 0;
    renderEvent();
}

function resetTargets() {
    // LAMP TEST: Turn on ALL LEDs briefly
    state.leds['led_enabled'] = true;
    state.leds['led_trip'] = true;
    targetLEDs.forEach(led => state.leds[led.id] = true);
    render();

    // Also light up all pushbutton LEDs for lamp test
    for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 2; col++) {
            const led = document.getElementById(`btn_${row}_${col}_led`);
            if (led) led.setAttribute('fill', CONFIG.ledGreen);
        }
    }

    // After 750ms, clear fault targets and restore normal state
    setTimeout(() => {
        state.faultActive = false;

        // Clear all fault-related targets
        targetLEDs.forEach(led => state.leds[led.id] = false);
        state.leds['led_trip'] = false;

        // Restore normal status LEDs
        state.leds['led_enabled'] = true;
        state.leds['led_pmcu_ok'] = true;
        state.leds['led_irig_lock'] = true;

        // 79 state based on current reclose setting
        state.leds['led_79_reset'] = state.recloseOn;
        state.leds['led_79_lockout'] = !state.recloseOn;

        render();
        updatePushbuttonLEDs();

        // Turn off unlabeled pushbutton LEDs (rows 2-5, except HELP button)
        for (let row = 2; row < 6; row++) {
            for (let col = 0; col < 2; col++) {
                if (row === 5 && col === 1) continue; // Skip HELP button LED
                const led = document.getElementById(`btn_${row}_${col}_led`);
                if (led) led.setAttribute('fill', CONFIG.ledOff);
            }
        }

        // Turn off help mode
        state.helpMode = false;
        updateHelpButtonLED();
        hideTooltip();
        document.getElementById('panel-svg')?.classList.remove('help-active');

        exitToRotating();
    }, 750);
}

// ============================================================
// RENDERING
// ============================================================
function startRotating() {
    stopRotating();
    renderRotating();
    state.rotatingTimer = setInterval(() => {
        state.rotatingIndex = (state.rotatingIndex + 1) % rotatingScreens.length;
        renderRotating();
    }, 4000);
}

function stopRotating() {
    if (state.rotatingTimer) {
        clearInterval(state.rotatingTimer);
        state.rotatingTimer = null;
    }
}

function renderRotating() {
    const screen = rotatingScreens[state.rotatingIndex];
    setLCD(screen.lines, screen.header);
}

function renderMenu() {
    const items = state.currentMenu.items;
    const lines = [];
    const maxVisible = 8;
    const start = Math.max(0, state.selectedIndex - 5);
    const end = Math.min(items.length, start + maxVisible);

    // Check if there are items above or below current view
    const hasAbove = start > 0;
    const hasBelow = end < items.length;

    for (let i = start; i < end; i++) {
        const lineIdx = i - start;
        const prefix = (i === state.selectedIndex ? '>' : ' ');
        let suffix = '';

        // Add scroll indicators on right side
        if (lineIdx === 0 && hasAbove) {
            suffix = ' ^'; // Up arrow indicator
        } else if (lineIdx === end - start - 1 && hasBelow) {
            suffix = ' v'; // Down arrow indicator
        }

        lines.push(prefix + items[i] + suffix);
    }

    // Add scroll bar on the right side of LCD
    const scrollInfo = items.length > maxVisible ? {
        position: state.selectedIndex / (items.length - 1),
        hasAbove: hasAbove,
        hasBelow: hasBelow
    } : null;

    setLCD(lines, state.currentMenu.title, scrollInfo);
}

function renderEvent() {
    if (state.faultActive) {
        const screenData = eventScreens[state.eventIndex]();
        setLCD(screenData.slice(1), screenData[0]);
    } else {
        // No fault active, show "no events" message
        setLCD(['', 'NO RECENT EVENTS', '', 'PRESS ESC TO RETURN', '', '', '', ''], 'EVENT SUMMARY');
    }
}

function renderStaticScreen(screenName) {
    const screen = staticScreens[screenName];
    if (screen) {
        setLCD(screen.lines, screen.title);
    }
}

function render() {
    document.getElementById('led_enabled')?.setAttribute('fill', state.leds['led_enabled'] ? CONFIG.ledGreen : CONFIG.ledOff);
    document.getElementById('led_trip')?.setAttribute('fill', state.leds['led_trip'] ? CONFIG.ledRed : CONFIG.ledOff);

    targetLEDs.forEach(led => {
        const el = document.getElementById(led.id);
        if (el) el.setAttribute('fill', state.leds[led.id] ? CONFIG.ledAmber : CONFIG.ledOff);
    });
}

// LCD
// ============================================================
let lcdCanvas, lcdCtx;

function initLCD() {
    lcdCanvas = document.getElementById('lcd-canvas');
    if (lcdCanvas) lcdCtx = lcdCanvas.getContext('2d');
}

function setLCD(lines, header, scrollInfo) {
    if (!lcdCtx) return;

    const canvasWidth = 265;
    const canvasHeight = 255;

    // Clear with LCD background
    lcdCtx.fillStyle = CONFIG.lcdBackground;
    lcdCtx.fillRect(0, 0, canvasWidth, canvasHeight);

    // Use a monospace font for clear LCD text
    lcdCtx.font = 'bold 14px "Courier New", monospace';
    lcdCtx.textBaseline = 'top';

    const lineHeight = 24;
    let y = 6;

    if (header) {
        // Header bar background
        lcdCtx.fillStyle = CONFIG.lcdForeground;
        lcdCtx.fillRect(0, 0, canvasWidth, 22);
        // Header text (inverted)
        lcdCtx.fillStyle = CONFIG.lcdBackground;
        lcdCtx.fillText(header, 6, 5);
        y = 28;
    }

    // Draw content lines
    lcdCtx.fillStyle = CONFIG.lcdForeground;
    (Array.isArray(lines) ? lines : [lines]).forEach(line => {
        if (y > canvasHeight - 20) return;
        lcdCtx.fillText(line || '', 6, y);
        y += lineHeight;
    });

    // Draw scroll bar if scrollInfo provided
    if (scrollInfo) {
        const scrollBarX = canvasWidth - 12;
        const scrollBarTop = header ? 28 : 6;
        const scrollBarHeight = canvasHeight - scrollBarTop - 10;

        // Draw scroll track
        lcdCtx.fillStyle = CONFIG.lcdForeground;
        lcdCtx.globalAlpha = 0.3;
        lcdCtx.fillRect(scrollBarX, scrollBarTop, 6, scrollBarHeight);
        lcdCtx.globalAlpha = 1.0;

        // Draw scroll position indicator
        const indicatorHeight = Math.max(20, scrollBarHeight * 0.2);
        const indicatorY = scrollBarTop + (scrollBarHeight - indicatorHeight) * scrollInfo.position;
        lcdCtx.fillStyle = CONFIG.lcdForeground;
        lcdCtx.fillRect(scrollBarX, indicatorY, 6, indicatorHeight);

        // Draw up arrow if there are items above
        if (scrollInfo.hasAbove) {
            lcdCtx.beginPath();
            lcdCtx.moveTo(scrollBarX + 3, scrollBarTop - 8);
            lcdCtx.lineTo(scrollBarX, scrollBarTop - 2);
            lcdCtx.lineTo(scrollBarX + 6, scrollBarTop - 2);
            lcdCtx.closePath();
            lcdCtx.fill();
        }

        // Draw down arrow if there are items below
        if (scrollInfo.hasBelow) {
            const arrowY = scrollBarTop + scrollBarHeight + 2;
            lcdCtx.beginPath();
            lcdCtx.moveTo(scrollBarX + 3, arrowY + 8);
            lcdCtx.lineTo(scrollBarX, arrowY + 2);
            lcdCtx.lineTo(scrollBarX + 6, arrowY + 2);
            lcdCtx.closePath();
            lcdCtx.fill();
        }
    }
}

document.addEventListener('keydown', e => {
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Escape: 'esc', Enter: 'ent' };
    if (map[e.key]) { e.preventDefault(); handleNav(map[e.key]); }
    if (e.key === 'f' || e.key === 'F') simulateFault();
    if (e.key === 'r' || e.key === 'R') resetTargets();
});

// ============================================================
// INIT
// ============================================================
function init() {
    generateSVG();
    initLCD();
    render();
    updatePushbuttonLEDs();
    startRotating();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
